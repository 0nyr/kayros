name: Publish to PyPI

# Trusted publishing (OIDC): configure https://pypi.org/manage/account/publishing/
# with repository 0nyr/kayros, workflow publish.yml, environment pypi.
on:
  release:
    types: [published]

jobs:
  build-sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Stage the pinned native library for the isolated sdist build
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y libboost-dev libgmp-dev
          bash .github/checkout-test-data.sh "$RUNNER_TEMP/mamut-routing" library
          python .github/stage-mamut-wheel.py "$RUNNER_TEMP/mamut-routing"
          python -m pip install --upgrade build
      - name: Build the sdist
        env:
          PIP_FIND_LINKS: ${{ runner.temp }}/mamut-routing/wheels
          PIP_CONSTRAINT: ${{ runner.temp }}/mamut-routing/wheels/constraints.txt
          PIP_BUILD_CONSTRAINT: ${{ runner.temp }}/mamut-routing/wheels/constraints.txt
        run: python -m build --sdist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  build-wheels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build manylinux wheels
        uses: pypa/cibuildwheel@v4.1.0
        env:
          # Keep in sync with `requires-python` in pyproject.toml and the CI
          # matrix: every interpreter the metadata admits must get a wheel,
          # otherwise resolvers silently fall back to a source build that
          # needs CMake, Boost.Graph and a C++23 compiler.
          CIBW_BUILD: "cp311-* cp312-* cp313-* cp314-*"
          CIBW_SKIP: "*-musllinux*"
          CIBW_ARCHS_LINUX: "x86_64"
          # The lera BPC ships in wheels. HiGHS is fetched and built
          # statically by CMake; Boost.Graph comes from the image and is
          # vendored into the wheel by auditwheel repair.
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_BEFORE_ALL_LINUX: >
            dnf -y install boost-devel boost1.78-devel gmp-devel git &&
            bash {project}/.github/checkout-test-data.sh /tmp/mamut-routing smoke
          CIBW_BEFORE_BUILD: CPLUS_INCLUDE_PATH=/usr/include/boost1.78 python {project}/.github/stage-mamut-wheel.py /tmp/mamut-routing
          CIBW_ENVIRONMENT: >-
            PIP_FIND_LINKS=/tmp/mamut-routing/wheels
            UV_FIND_LINKS=/tmp/mamut-routing/wheels
            PIP_CONSTRAINT=/tmp/mamut-routing/wheels/constraints.txt
            PIP_BUILD_CONSTRAINT=/tmp/mamut-routing/wheels/constraints.txt
          # Install the runtime dependency from the public package index.
          CIBW_TEST_ENVIRONMENT: >-
            CPLUS_INCLUDE_PATH=/usr/include/boost1.78
            PIP_FIND_LINKS="" UV_FIND_LINKS="" PIP_CONSTRAINT="" PIP_BUILD_CONSTRAINT=""
          CIBW_TEST_COMMAND: >
            python -c "import kayros._core, kayros._lera, mamut_routing_lib._td_exact; from kayros.exact import solve_exact" &&
            python {project}/tests/wheel_smoke.py /tmp/mamut-routing
      - uses: actions/upload-artifact@v7
        with:
          name: wheels
          path: wheelhouse/*.whl

  publish:
    needs: [build-sdist, build-wheels]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1

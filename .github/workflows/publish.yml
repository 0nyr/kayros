name: Publish to PyPI

# Trusted publishing (OIDC): configure https://pypi.org/manage/account/publishing/
# with repository 0nyr/kayros, workflow publish.yml, environment pypi.
on:
  release:
    types: [published]

jobs:
  build-sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pipx run build --sdist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  build-wheels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build manylinux wheels
        uses: pypa/cibuildwheel@v4.1.0
        env:
          # Keep in sync with `requires-python` in pyproject.toml and the CI
          # matrix: every interpreter the metadata admits must get a wheel,
          # otherwise resolvers silently fall back to a source build that
          # needs CMake, Boost.Graph and a C++23 compiler.
          CIBW_BUILD: "cp311-* cp312-* cp313-* cp314-*"
          CIBW_SKIP: "*-musllinux*"
          CIBW_ARCHS_LINUX: "x86_64"
          # The lera BPC ships in wheels. HiGHS is fetched and built
          # statically by CMake; Boost.Graph comes from the image and is
          # vendored into the wheel by auditwheel repair.
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_BEFORE_ALL_LINUX: dnf -y install boost-devel git
          # Each wheel is installed and exercised before upload: imports, then
          # an anytime solve and a cold exact solve of Dabia2013 C101 with 25
          # customers (tests/wheel_smoke.py). The instance comes from a sparse
          # clone of MAMUT-routing, so the upload needs GitHub to be reachable
          # from the build container. The full test suite runs on the same
          # wheels in the wheel job of ci.yml.
          CIBW_BEFORE_TEST: >
            test -d /tmp/mamut-routing ||
            (git clone --depth 1 --filter=blob:none --sparse
            https://github.com/ANR-MAMUT/MAMUT-routing.git /tmp/mamut-routing &&
            git -C /tmp/mamut-routing sparse-checkout set
            benchmarks/TDVRPTW/Dabia2013/n=25)
          CIBW_TEST_COMMAND: >
            python -c "import kayros._core, kayros._lera; from kayros import lera" &&
            python {project}/tests/wheel_smoke.py /tmp/mamut-routing
      - uses: actions/upload-artifact@v7
        with:
          name: wheels
          path: wheelhouse/*.whl

  publish:
    needs: [build-sdist, build-wheels]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1

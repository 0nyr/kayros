name: CI

on:
  push:
    branches: [main, "dev/*-ci"]
    # A push that only changes Markdown files at the repository root (README,
    # CHANGELOG, AUTHORS) starts no run. cpp/lera/NOTICE.md is shipped in the
    # wheel as a license file and still starts one.
    paths-ignore: ["*.md"]
  pull_request:

# A newer push to the same branch or pull request cancels the run in progress.
# Only the latest pushed commit of a branch gets a verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  no-cplex-gate:
    # The default kayros build must never reference CPLEX headers. The
    # vendored Lera CPLEX backend (cpp/lera/goc/*/linear_programming/cplex/)
    # is the sanctioned exception: CMake compiles it only under the opt-in
    # -DLERA_LP_BACKEND=cplex, never in the default (HiGHS) build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Grep gate — no ilcplex/ilconcert outside the opt-in cplex backend
        run: |
          ! grep -rn --include='*.h' --include='*.hpp' --include='*.cpp' --exclude-dir=cplex -e 'ilcplex' -e 'ilconcert' cpp/ src/

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Upgrade pip (dependency-groups support needs >= 25.1)
        run: python -m pip install --upgrade pip
      - name: Install Boost.Graph and GMP
        run: sudo apt-get -o Acquire::Retries=3 update && sudo apt-get -o Acquire::Retries=3 install -y libboost-graph-dev libgmp-dev
      - name: Fetch the pinned MAMUT library and test families
        run: bash .github/checkout-test-data.sh "$RUNNER_TEMP/mamut-routing"
      - name: Build the pinned native library for this Python
        run: python .github/stage-mamut-wheel.py "$RUNNER_TEMP/mamut-routing"
      - name: Install the editable Kayros with isolated build dependencies
        env:
          PIP_FIND_LINKS: ${{ runner.temp }}/mamut-routing/wheels
          PIP_BUILD_CONSTRAINT: ${{ runner.temp }}/mamut-routing/wheels/constraints.txt
          PIP_CONSTRAINT: ${{ runner.temp }}/mamut-routing/wheels/constraints.txt
        run: python -m pip install -e . --group dev
      - name: Check the solver and exact library extensions
        run: python -c "import kayros._core, kayros._lera, mamut_routing_lib._td_exact"
      - name: Run tests against the pinned family collections
        env:
          MAMUT_ROUTING_ROOT: ${{ runner.temp }}/mamut-routing
          KAYROS_REQUIRE_BENCHMARKS: "1"
        run: python -m pytest -o empty_parameter_set_mark=fail_at_collect
      - name: C++ unit tests of the exact component (tests/cpp, HiGHS backend)
        # Separate CMake configuration, outside the package build. The
        # kayros_cpp_tests target builds and runs every test of tests/cpp.
        # One Python version is enough, since the tests do not use Python.
        if: matrix.python-version == '3.12'
        run: |
          python -m pip install "pybind11>=2.13"
          cmake -S . -B "$RUNNER_TEMP/cpp-tests" -DCMAKE_BUILD_TYPE=Release \
            -DPython_EXECUTABLE="$(command -v python)" \
            -DMAMUTRouting_DIR="$(python -m mamut_routing_lib.cmake)" \
            -Dpybind11_DIR="$(python -m pybind11 --cmakedir)"
          cmake --build "$RUNNER_TEMP/cpp-tests" --target kayros_cpp_tests -j 4

  wheel:
    # Build the manylinux wheel of each supported CPython with the settings of
    # publish.yml and run the test suite on the installed wheel, inside the
    # build container. A build failure in the release image then shows on the
    # pull request and not after a release is published, and the tests run on
    # the artifact that users install. Keep the environment in sync with
    # publish.yml. This job does not depend on the Ubuntu package mirrors,
    # unlike the test job above.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cp: ["cp311", "cp312", "cp313", "cp314"]
    steps:
      - uses: actions/checkout@v5
      - name: Build the manylinux wheel and test it
        uses: pypa/cibuildwheel@v4.1.0
        env:
          CIBW_BUILD: "${{ matrix.cp }}-*"
          CIBW_SKIP: "*-musllinux*"
          CIBW_ARCHS_LINUX: "x86_64"
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_BEFORE_ALL_LINUX: >
            dnf -y install boost-devel boost1.78-devel gmp-devel git &&
            bash {project}/.github/checkout-test-data.sh /tmp/mamut-routing
          # The library uses Boost.Multiprecision under C++20. The image's
          # Boost 1.66 expects the removed std::allocator::rebind member.
          CIBW_BEFORE_BUILD: CPLUS_INCLUDE_PATH=/usr/include/boost1.78 python {project}/.github/stage-mamut-wheel.py /tmp/mamut-routing
          CIBW_ENVIRONMENT: >-
            PIP_FIND_LINKS=/tmp/mamut-routing/wheels
            UV_FIND_LINKS=/tmp/mamut-routing/wheels
            PIP_CONSTRAINT=/tmp/mamut-routing/wheels/constraints.txt
            PIP_BUILD_CONSTRAINT=/tmp/mamut-routing/wheels/constraints.txt
          CIBW_TEST_REQUIRES: "pytest>=8"
          CIBW_TEST_ENVIRONMENT: MAMUT_ROUTING_ROOT=/tmp/mamut-routing KAYROS_REQUIRE_BENCHMARKS=1
          CIBW_TEST_COMMAND: >
            python -c "import kayros._core, kayros._lera, mamut_routing_lib._td_exact" &&
            python -m pytest -o empty_parameter_set_mark=fail_at_collect {project}/tests &&
            python {project}/tests/wheel_smoke.py /tmp/mamut-routing
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.cp }}
          path: wheelhouse/*.whl

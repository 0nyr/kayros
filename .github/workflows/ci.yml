name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  no-cplex-gate:
    # The default kayros build must never reference CPLEX headers. The
    # vendored Lera CPLEX backend (cpp/lera/goc/*/linear_programming/cplex/)
    # is the sanctioned exception: CMake compiles it only under the opt-in
    # -DLERA_LP_BACKEND=cplex, never in the default (HiGHS) build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Grep gate — no ilcplex/ilconcert outside the opt-in cplex backend
        run: |
          ! grep -rn --include='*.h' --include='*.hpp' --include='*.cpp' --exclude-dir=cplex -e 'ilcplex' -e 'ilconcert' cpp/ src/

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Upgrade pip (dependency-groups support needs >= 25.1)
        run: python -m pip install --upgrade pip
      - name: Install Boost.Graph (lera BPC dependency; HiGHS is fetched by CMake)
        run: sudo apt-get -o Acquire::Retries=3 update && sudo apt-get -o Acquire::Retries=3 install -y libboost-graph-dev
      - name: Install (editable + dev group)
        run: pip install -e . --group dev
      - name: Lera BPC import gate (default install ships the exact component)
        run: python -c "import kayros._lera; from kayros import lera; print('lera OK')"
      - name: Fetch Dabia2013 n=25 and n=50 benchmarks (sparse)
        # n=50 carries RC107, the reproducer of the partial-dominance defect
        # repaired in 1.7.0 (tests/test_lera_partial_dominance.py). Without it
        # that regression test is collected with an empty parameter set.
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/ANR-MAMUT/MAMUT-routing.git "$RUNNER_TEMP/mamut-routing"
          git -C "$RUNNER_TEMP/mamut-routing" sparse-checkout set \
            benchmarks/TDVRPTW/Dabia2013/n=25 benchmarks/TDVRP/Dabia2013/n=25 \
            benchmarks/TDVRPTW/Dabia2013/n=50
      - name: Run tests (incl. checker-equivalence gate on Dabia n=25)
        env:
          MAMUT_ROUTING_ROOT: ${{ runner.temp }}/mamut-routing
        run: pytest
      - name: C++ unit tests of the exact component (tests/cpp, HiGHS backend)
        # Separate CMake configuration, outside the package build. The
        # kayros_cpp_tests target builds and runs every test of tests/cpp.
        # One Python version is enough, since the tests do not use Python.
        if: matrix.python-version == '3.12'
        run: |
          python -m pip install "pybind11>=2.13"
          cmake -S . -B "$RUNNER_TEMP/cpp-tests" -DCMAKE_BUILD_TYPE=Release \
            -Dpybind11_DIR="$(python -m pybind11 --cmakedir)"
          cmake --build "$RUNNER_TEMP/cpp-tests" --target kayros_cpp_tests -j 4

  wheel:
    # Build the manylinux wheel of each supported CPython with the settings of
    # publish.yml and run the test suite on the installed wheel, inside the
    # build container. A build failure in the release image then shows on the
    # pull request and not after a release is published, and the tests run on
    # the artifact that users install. Keep the environment in sync with
    # publish.yml. This job does not depend on the Ubuntu package mirrors,
    # unlike the test job above.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cp: ["cp311", "cp312", "cp313", "cp314"]
    steps:
      - uses: actions/checkout@v5
      - name: Build the manylinux wheel and test it
        uses: pypa/cibuildwheel@v4.1.0
        env:
          CIBW_BUILD: "${{ matrix.cp }}-*"
          CIBW_SKIP: "*-musllinux*"
          CIBW_ARCHS_LINUX: "x86_64"
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_BEFORE_ALL_LINUX: dnf -y install boost-devel git
          CIBW_TEST_REQUIRES: "pytest>=8"
          # Same benchmark subset as the test job above.
          CIBW_BEFORE_TEST: >
            test -d /tmp/mamut-routing ||
            (git clone --depth 1 --filter=blob:none --sparse
            https://github.com/ANR-MAMUT/MAMUT-routing.git /tmp/mamut-routing &&
            git -C /tmp/mamut-routing sparse-checkout set
            benchmarks/TDVRPTW/Dabia2013/n=25 benchmarks/TDVRP/Dabia2013/n=25
            benchmarks/TDVRPTW/Dabia2013/n=50)
          CIBW_TEST_COMMAND: >
            python -c "import kayros._core, kayros._lera; from kayros import lera" &&
            MAMUT_ROUTING_ROOT=/tmp/mamut-routing pytest {project}/tests
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.cp }}
          path: wheelhouse/*.whl

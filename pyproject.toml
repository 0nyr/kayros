[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.13", "mamut-routing-lib>=0.13.0.dev0,<0.14"]
build-backend = "scikit_build_core.build"

[project]
name = "kayros"
# Version bump checklist — this key is the single source for code and packaging
# (scikit-build injects it as SKBUILD_PROJECT_VERSION_FULL -> CMake -> the
# KAYROS_VERSION compile definition -> kayros.__version__; the "0.0.0" in
# cpp/bindings/module.cpp is only a no-CMake fallback, never bump it).
# Bump BY HAND alongside this key: CITATION.cff `version:`, the README status
# line, and create the matching GitHub release tag vX.Y.Z (publish.yml ships
# the wheels to PyPI on release).
version = "2.0.0.dev0"
description = "Time-dependent vehicle routing with duration and fleet-cost-plus-duration objectives (TDVRPTW and TDVRP)"
readme = "README.md"
# The 4 authors in citation order, all in the same form (name only), so that
# the core metadata lists them together in one Author field. An author with an
# email would go to Author-email instead and be shown apart from the others.
# The contact address is the maintainer's.
authors = [
    { name = "Florian Rascoussier" },
    { name = "Romain Billot" },
    { name = "Lina Fahed" },
    { name = "Christine Solnon" },
]
maintainers = [
    { name = "Florian Rascoussier", email = "onyr.maintainer@gmail.com" },
]
license = { text = "MIT" }
# Upper bound is deliberate: kayros ships compiled wheels, so the metadata must
# not admit an interpreter the wheel matrix does not cover. Without the cap, a
# resolver on a newer CPython finds no matching wheel, silently falls back to
# the sdist, and drags the user into a CMake + Boost.Graph + C++23 source build.
# `<3.15` (not `<=3.14`) because PEP 440 orders 3.14.6 above 3.14.
# Widen this only together with CIBW_BUILD in publish.yml, the CI matrix, and
# the classifiers below.
requires-python = ">=3.11,<3.15"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Mathematics",
]
# The benchmark and checker dependency: loaders of the family collections,
# the exact evaluation profiles (td-binary64-exact-v1) and the BKS helpers.
# Kayros 2.0 follows the development head of 0.13 until its release.
dependencies = [
    "mamut-routing-lib>=0.13.0.dev0,<0.14",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/0nyr/kayros"
Issues = "https://github.com/0nyr/kayros/issues"
Benchmarks = "https://github.com/ANR-MAMUT/MAMUT-routing"
Changelog = "https://github.com/0nyr/kayros/blob/main/CHANGELOG.md"

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.26"
wheel.packages = ["src/kayros"]
sdist.exclude = [".github", "nix-dev"]
# License/attribution files carried into the wheel's .dist-info/licenses/. The
# root LICENSE covers kayros itself; cpp/lera/NOTICE.md is the MIT attribution
# for the vendored Lera-Romero BPC code, which ships compiled inside the wheel
# and MUST travel with its NOTICE (the default license-files globs only match
# top-level files, so the nested NOTICE is listed explicitly).
wheel.license-files = ["LICENSE", "cpp/lera/NOTICE.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
